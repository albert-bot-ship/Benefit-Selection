function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function pd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function md(s){ const d=pd(s); return (d.getMonth()+1)+"/"+d.getDate(); }
function status(start,end){
  const t=today(), s=pd(start), e=pd(end);

  return {k:"on", txt:"至 "+md(end), active:true};
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[\uff01-\uff5e]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xfee0))
    .replace(/[\s・·／\/（）()「」\-]/g,"");
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function terms(q){
  const nq=norm(q); if(!nq) return [];
  const set=new Set([nq]);
  SYN.forEach(group=>{
    const ng=group.map(norm);
    if(ng.some(w=>w===nq)) ng.forEach(w=>set.add(w));
  });
  return [...set];
}

/* 標示：在原文中找出符合字串的位置（忽略「不含…」段落） */
function markText(text, tq){
  let ns="", map=[];
  for(let i=0;i<text.length;i++){ for(const ch of norm(text[i])){ ns+=ch; map.push(i); } }
  const skip=[]; text.replace(/不含[^）)]*/g,(m,off)=>{ skip.push([off,off+m.length]); return m; });
  let rg=[];
  tq.forEach(t=>{ if(!t) return; let k=ns.indexOf(t);
    while(k!==-1){ const a=map[k], b=map[k+t.length-1]+1;
      if(!skip.some(([x,y])=>a<y&&b>x)) rg.push([a,b]); k=ns.indexOf(t,k+1); } });
  if(!rg.length) return {html:esc(text), found:false};
  rg.sort((x,y)=>x[0]-y[0]); const mg=[rg[0].slice()];
  rg.slice(1).forEach(r=>{ const l=mg[mg.length-1]; if(r[0]<=l[1]) l[1]=Math.max(l[1],r[1]); else mg.push(r.slice()); });
  let out="", pos=0;
  mg.forEach(([a,b])=>{ out+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; pos=b; });
  return {html:out+esc(text.slice(pos)), found:true};
}
/* 判斷某通路是否符合搜尋，以及符合方式：text 名稱文字、alias 別名、group 類別名稱 */
function matchInfo(name, alias, gt, tq){
  if(!tq.length) return null;
  const nName=norm(name.replace(/不含[^）)]*/g,""));
  if(nName.includes(tq[0])) return "text";
  if(tq.some(t=>nName.includes(t))) return "syn";
  if(alias && tq.some(t=>norm(alias).includes(t))) return "alias";
  if(tq.some(t=>norm(gt).includes(t))) return "group";
  return null;
}

/* 回饋區間（依目前等級） */
function rangeOf(p){ let a=Infinity,b=0; p.groups.forEach(g=>{ const r=rateOf(g.r); a=Math.min(a,r); b=Math.max(b,r); });
  return a===b ? fmt(a)+"%" : fmt(a)+"%~"+fmt(b)+"%"; }
/* 回饋最高的 3 個類別 */
function topGroups(p){ const seen=new Set(), out=[];
  p.groups.slice().sort((x,y)=>rateOf(y.r)-rateOf(x.r)).forEach(g=>{ if(!seen.has(g.t)){ seen.add(g.t); out.push(g); } });
  return out.slice(0,3); }
function cardFace(p,o={}){
  const st=status(p.start,p.end);
  const rate = o.rate!=null ? o.rate : rangeOf(p);

  if(o.hits) pills.push(`<span class="pill hit">符合 ${o.hits} 筆</span>`);
  if(st.k==="warn"||st.k==="end"||st.k==="soon") pills.push(`<span class="pill">${st.txt}</span>`);
  if(o.showReq!==false && reqLabel(p)) pills.push(`<span class="pill">${reqLabel(p)}</span>`);
  const list=topGroups(p).map(g=>`<li><span class="lr">${fmt(rateOf(g.r))}%</span><span class="lt">${esc(g.t)}</span></li>`).join("");
  return `<div class="cface${st.active?"":" expired"}" style="${skin(p)}"><span class="tex"></span><span class="holo"></span><span class="glare"></span>
    <div class="k-top"><span class="k-name">${esc(p.name)}</span><span class="k-rate${String(rate).length>6?" long":""}">${esc(rate)}</span></div>
    ${pills.length?`<div class="k-pills">${pills.join("")}</div>`:""}
    <div class="k-mid"><div class="k-chip"><span class="emv">${CHIP}</span>${NFC}</div><div class="k-brand"><b>CUBE</b>國泰世華</div></div>
    <ul class="k-list">${list}</ul>
    <div class="k-valid"><small>VALID</small>${mdp(p.start)} – ${mdp(p.end)}</div>
    ${progHTML(p)}
  </div>`;
}
/* 有效期進度條 */
function progOf(p){ const s=pd(p.start), e=pd(p.end), t=today();
  const total=Math.round((e-s)/DAY)+1, done=Math.min(total,Math.max(0,Math.round((t-s)/DAY)+1));
  return Math.round(done/total*100); }
function progHTML(p){ return `<span class="cf-prog ${status(p.start,p.end).k}" style="--p:${progOf(p)}%" aria-hidden="true"></span>`; }
/* 卡片背面：依類別彙整回饋率 */

}
function cardBack(p){

}

function setGlint(el,x,y){ el.style.setProperty("--mx",x.toFixed(1)+"%"); el.style.setProperty("--my",y.toFixed(1)+"%"); }
document.addEventListener("pointermove",ev=>{
  if(REDUCE||!ev.target.closest) return;
  const c=ev.target.closest(".cface"); if(!c) return;
  const r=c.getBoundingClientRect(); setGlint(c,(ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100);
},{passive:true});
document.addEventListener("pointerout",ev=>{
  if(!ev.target.closest) return; const c=ev.target.closest(".cface");
  if(c && !(ev.relatedTarget && c.contains(ev.relatedTarget))){ c.style.removeProperty("--mx"); c.style.removeProperty("--my"); }
});
let tiltOn=false, tiltRAF=0, tiltXY=null;
function onOrient(e){
  if(e.gamma==null) return;
  const x=Math.max(-25,Math.min(25,e.gamma)), y=Math.max(10,Math.min(80,e.beta||45));
  tiltXY=[50+x*2,(y-10)/70*100];
  if(!tiltRAF) tiltRAF=requestAnimationFrame(()=>{ tiltRAF=0; setGlint(document.documentElement,tiltXY[0],tiltXY[1]); });
}
function enableTilt(gesture){
  const D=window.DeviceOrientationEvent;
  if(REDUCE||!D) return Promise.resolve(false);
  let p;
  if(typeof D.requestPermission==="function"){ if(!gesture) return Promise.resolve(false); try{ p=D.requestPermission(); }catch(e){ return Promise.resolve(false); } }
  else p=Promise.resolve("granted");
  return p.then(r=>{ if(r!=="granted") return false; if(!tiltOn){ window.addEventListener("deviceorientation",onOrient); tiltOn=true; } return true; },()=>false);
}
function disableTilt(){ window.removeEventListener("deviceorientation",onOrient); tiltOn=false;
  document.documentElement.style.removeProperty("--mx"); document.documentElement.style.removeProperty("--my"); }

const CURS=[["TWD","新臺幣","NT$"],["JPY","日圓","¥"],["KRW","韓元","₩"],["USD","美元","US$"],["EUR","歐元","€"],
  ["CNY","人民幣","RMB "],["HKD","港幣","HK$"],["THB","泰銖","฿"],["SGD","新加坡幣","S$"],["GBP","英鎊","£"]];
const FX_API="https://open.er-api.com/v6/latest/TWD", FX_SITE="https://www.exchangerate-api.com";
const FEE=1.5; /* 官網：本行0.5%國外交易服務費＋國際組織手續費，合計約1.5% */
state.cur=load("cube-cur","TWD"); state.cq=""; state.ccat="all";
let FX=load("cube-fx",null)||{};
function fxOn(){ return state.cur!=="TWD"; }
function curOf(c){ return CURS.find(x=>x[0]===c)||CURS[0]; }
function amtVal(){ const a=parseFloat(String(state.amt).replace(/[,，\s]/g,"")); return a>0?a:0; }
function fxRate(){ if(!fxOn()) return 1; return (FX.rates&&FX.rates[state.cur]) ? 1/FX.rates[state.cur] : null; }
function ntd(){ const a=amtVal(), r=fxRate(); return (a&&r)?a*r:0; }
function approx(){ return fxOn()?"約 ":""; }
const n0=x=>Math.round(x).toLocaleString("zh-TW"), n1=x=>(Math.round(x*10)/10).toLocaleString("zh-TW",{maximumFractionDigits:1}), nA=x=>x.toLocaleString("zh-TW",{maximumFractionDigits:2});
function ptsOf(n,rate){ return Math.round(n*rate/100); }
function ptsText(rate){ const n=ntd(); return n?approx()+ptsOf(n,rate).toLocaleString("zh-TW")+" 點":""; }
function formulaText(rate){
  const a=amtVal(); if(!a) return "輸入上方金額，可試算小樹點(信用卡)";
  const n=ntd(); if(!n) return "匯率取得中，暫無法換算";
  const pts=ptsOf(n,rate);
  let t="可得 <b>"+approx()+pts.toLocaleString("zh-TW")+" 點</b>";
  if(fxOn()){ const f=n*FEE/100; t+="・手續費約 NT$"+n1(f)+"・淨回饋約 <b>"+n1(pts-f)+"</b>"; }
  return t;
}
function updateAmts(){
  document.querySelectorAll("[data-rate]").forEach(el=>{
    const r=parseFloat(el.dataset.rate);
    if(el.hasAttribute("data-formula")) el.innerHTML=formulaText(r); else el.textContent=ptsText(r);
  });
}
function updatePts(){ updateAmts(); }
function loadFx(force){
  if(!fxOn()||FX.loading) return;
  if(!force && FX.rates && Date.now()-FX.t<6*3600e3) return;
  if(!window.fetch){ FX.err=true; renderFxLine(); return; }
  FX.loading=true; FX.err=false; renderFxLine();
  fetch(FX_API).then(r=>r.json()).then(d=>{
    if(!d||d.result!=="success"||!d.rates) throw new Error("fx");
    FX={t:Date.now(),upd:(d.time_last_update_unix||0)*1000,rates:d.rates}; save("cube-fx",FX); refreshCalc();
  }).catch(()=>{ FX.loading=false; FX.err=true; refreshCalc(); });
}

function findRows(tq,cat){
  let list=ENTRIES.filter(e=> (cat==="all" || e.cat===cat) && (state.bday || e.plan.id!=="bday"));
  if(tq.length) list=list.filter(e=>tq.some(t=>e.hay.includes(t)));

    const st=status(e.plan.start,e.plan.end), el=eligible(e.plan);
    return {...e, st, el, rate:rateOf(e.group.r), usable: st.active && el.ok};

}

function groupHTML(p,rs,tq){

  }).join("");

    <div class="rp-head"><span class="mini" style="${skin(p)}"></span><b>${esc(p.name)}</b><span class="rp-tags">${tags.join("")}</span></div>

function railIndex(rail){ const mid=rail.scrollLeft+rail.clientWidth/2; let best=0,d=1e9;
  rail.querySelectorAll(".slide").forEach((s,i)=>{ const x=Math.abs(s.offsetLeft+s.offsetWidth/2-mid); if(x<d){d=x;best=i;} }); return best; }
function railGo(rail,i,smooth){ const s=rail.querySelectorAll(".slide")[i]; if(!s) return;
  const left=s.offsetLeft-(rail.clientWidth-s.offsetWidth)/2;
  if(smooth&&!REDUCE) rail.scrollTo({left,behavior:"smooth"}); else rail.scrollLeft=left; }
function railBind(rail,onChange,start){ let t=null,last=start;
  rail.addEventListener("scroll",()=>{ clearTimeout(t); t=setTimeout(()=>{ const i=railIndex(rail); if(i!==last){ last=i; onChange(i); } },90); },{passive:true}); }

      const gHit = tq.length && tq.some(t=>norm(g.t).includes(t));

        const cls = how ? ` class="hit${(how==="text"||how==="syn")?"":" whole"}"` : "";

    }).join("");
    if(state.cat!=="all" && !groups) return;
    if(pHits){ hitPlans++; hitItems+=pHits; }
    items.push({p,pHits,groups,open: tq.length ? pHits>0 : false});
  });
  PLAN_ITEMS=items;
  const flipBtn=it=>`<button class="flip" aria-expanded="${it.open}" aria-label="${esc(it.p.name)}：翻面查看回饋摘要與通路">
        <span class="flip-in"><span class="face front">${cardFace(it.p,{hits:it.pHits})}</span><span class="face back">${cardBack(it.p)}</span></span></button>`;
  const mode=state.pmode;

    html=`<div class="rail prail" id="planRail">${items.map((it,i)=>`<div class="slide"><div class="wcard${i===cur&&it.open?" flipped":""}" data-pid="${it.p.id}" style="${skin(it.p)}">${flipBtn(it)}</div></div>`).join("")}</div>
      ${dotsHTML("planDots",items.length,cur)}<div id="railDetail">${railDetailHTML(items[cur])}</div>`;
  }else if(items.length && mode==="stack"){
    const first=items.findIndex(i=>i.open);
    html=`<div class="pstack">${items.map((it,i)=>`<div class="wcard${i===first?" open flipped":""}" data-pid="${it.p.id}" style="${skin(it.p)}">${flipBtn({...it,open:i===first})}<div class="wbody">${planBody(it)}</div></div>`).join("")}</div>`;
  }else if(items.length){
    html=`<div class="cardgrid">${items.map(it=>`<div class="wcard${it.open?" flipped":""}" data-pid="${it.p.id}" style="${skin(it.p)}">${flipBtn(it)}<div class="wbody">${planBody(it)}</div></div>`).join("")}</div>`;
  }
  const HINT={grid:"點卡片翻面，查看回饋摘要、通路與使用提醒",stack:"點卡片展開，再點翻面",rail:"左右滑動換卡，點卡片翻面"};
  const bar=`<div class="w-bar"><span class="hint m0">${HINT[mode]}</span><div class="seg" role="group" aria-label="排列方式">${[["grid","卡片牆"],["stack","堆疊"],["rail","輪播"]].map(([v,t])=>`<button data-act="pmode" data-v="${v}" aria-pressed="${mode===v}">${t}</button>`).join("")}</div></div>`;
  const sumBox = tq.length ? `<div class="hitsum">「${esc(state.q)}」出現在 ${hitPlans} 個方案、共 ${hitItems} 筆通路，已自動展開並標示。${hitPlans?"":"目前沒有方案包含這個通路。"}</div>` : "";
  const gTable=`<div class="lvwrap"><table class="lvtable"><thead><tr><th>消費項目</th><th>消費金額</th><th>消費類別</th><th>回饋率</th><th>回饋點數</th></tr></thead><tbody>
    <tr><td>雄獅旅行社</td><td>NT$1,800</td><td>一般消費</td><td>0.3%</td><td>5 (1800*0.3%=5.4)</td></tr>
    <tr><td>新光三越</td><td>NT$3,000</td><td>指定美食/購物消費</td><td>3%</td><td>90 (3000*3%=90)</td></tr></tbody></table></div>`;
  const gNotes=`<details class="gnotes"><summary>注意事項<span>官網「CUBE卡權益方案」頁面共通注意事項</span></summary>
    <ol>${GLOBAL_NOTES.map((n,i)=>`<li>${esc(n).replace(/\n/g,"<br>")}${i===6?gTable:""}</li>`).join("")}</ol></details>`;
  $("#v-wallet").innerHTML=sumBox+lvTable+bar+(html||`<p class="hint">這個類別目前沒有通路。</p>`)+gNotes+actsHTML();

/* ===== 外觀：自動（依 iPhone 定位計算日出日落）／淺色／深色 ===== */
const TAICHUNG={lat:24.1477,lng:120.6736,src:"台中（未取得定位）"};
function sunTimes(date,lat,lng){
  const rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, J0=0.0009, e=rad*23.4397;
  const toDays=d=>d.valueOf()/dayMs-0.5+J1970-J2000;
  const fromJ=j=>new Date((j+0.5-J1970)*dayMs);
  const lw=rad*-lng, phi=rad*lat, d=toDays(date);
  const n=Math.round(d-J0-lw/(2*Math.PI));
  const approx=(Ht)=>J0+(Ht+lw)/(2*Math.PI)+n;
  const ds=approx(0);
  const M=rad*(357.5291+0.98560028*ds);
  const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const Lon=M+C+rad*102.9372+Math.PI;
  const dec=Math.asin(Math.sin(e)*Math.sin(Lon));
  const transit=a=>J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*Lon);
  const Jnoon=transit(ds);
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const Jset=transit(approx(w)), Jrise=Jnoon-(Jset-Jnoon);
  return {rise:fromJ(Jrise), set:fromJ(Jset)};
}
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
state.themeMode=load("cube-theme-mode","auto");
state.loc=load("cube-loc",null);
function currentLoc(){ return state.loc || TAICHUNG; }
function requestLoc(force){
  const fresh=state.loc && (Date.now()-state.loc.t < 7*864e5);
  if((fresh && !force) || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    state.loc={lat:pos.coords.latitude,lng:pos.coords.longitude,src:"iPhone 定位",t:Date.now()};
    save("cube-loc",state.loc); applyTheme();
  },()=>{},{maximumAge:864e5,timeout:10000});
}
function applyTheme(){
  let theme=state.themeMode;
  const L=currentLoc(), st=sunTimes(new Date(),L.lat,L.lng), now=new Date();
  if(theme==="auto") theme=(now>=st.rise && now<st.set)?"light":"dark";
  document.documentElement.setAttribute("data-theme",theme);
  save("cube-theme-last",theme);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", theme==="light"?"#F3F5FA":theme==="luxury"?"#120D12":"#07070F");
  document.querySelectorAll("#themeSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===state.themeMode));
  const info=$("#sunInfo");
  if(info) info.textContent=`今日日出 ${hm(st.rise)}／日落 ${hm(st.set)}（${L.src}）`;
}
document.querySelectorAll("#themeSeg button").forEach(b=>b.onclick=()=>{
  state.themeMode=b.dataset.mode; save("cube-theme-mode",state.themeMode);
  if(state.themeMode==="auto") requestLoc(false);

});

/* 卡面光澤設定 */
function syncTiltBtn(){ const b=$("#tiltBtn"); b.setAttribute("aria-pressed",state.tilt);
  b.querySelector("b").textContent=state.tilt?"已啟用手機傾斜光澤":"啟用手機傾斜光澤";
  if(REDUCE) b.querySelector("small").textContent="系統已開啟「減少動態效果」，光澤固定不動"; }
$("#tiltBtn").onclick=()=>{
  if(state.tilt){ state.tilt=false; save("cube-tilt",false); disableTilt(); syncTiltBtn(); toast("已關閉手機傾斜光澤"); return; }
  enableTilt(true).then(ok=>{ state.tilt=ok; save("cube-tilt",ok); syncTiltBtn(); toast(ok?"已啟用手機傾斜光澤":"未取得「動作與方向」權限"); });
};
syncTiltBtn();
if(state.tilt){
  enableTilt(false).then(ok=>{
    if(!ok && typeof (window.DeviceOrientationEvent||{}).requestPermission==="function"){
      document.addEventListener("click",function once(){ document.removeEventListener("click",once,true); enableTilt(true); },true);
    }
  });
}
if(fxOn()) loadFx(false);
renderCats(); render();
</script>
</body>
</html>
